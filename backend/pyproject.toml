[project]
name = "motoservicio-timon"
version = "2.0.0"
description = "Agente conversacional cognitivo para taller de motos"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "redis>=5.1.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiomysql>=0.2.0",
    "qdrant-client>=1.12.0",
    "google-genai>=1.0.0",
    "celery>=5.4.0",
    "aio-pika>=9.4.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "tenacity>=9.0.0",
    "python-multipart>=0.0.12",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
